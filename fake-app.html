<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberMart — Online Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Navbar ─────────────────────────────────────────────── */
    .navbar {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0 30px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .nav-brand {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    .nav-brand span { font-weight: 400; opacity: 0.7; font-size: 13px; margin-left: 6px; }
    .nav-links { display: flex; align-items: center; gap: 8px; }
    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .nav-links a:hover { color: #e2e8f0; background: rgba(255,255,255,0.05); }
    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      box-shadow: 0 4px 15px rgba(59,130,246,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
    .btn-ghost {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-ghost:hover { border-color: #3b82f6; color: #3b82f6; }
    .btn-dropdown {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      position: relative;
    }

    /* ── Dropdown Menu ──────────────────────────────────────── */
    .dropdown { position: relative; }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      min-width: 160px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 100;
      overflow: hidden;
    }
    .dropdown.open .dropdown-menu { display: block; }
    .dropdown-menu button {
      display: block;
      width: 100%;
      padding: 10px 16px;
      border: none;
      background: none;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dropdown-menu button:hover { background: rgba(59,130,246,0.15); }

    /* ── Hero / Products Page ──────────────────────────────── */
    .page { display: none; }
    .page.active { display: block; }

    .products-page { padding: 40px 30px; }
    .products-page h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .products-page .subtitle {
      color: #64748b;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 14px;
    }
    .search-bar input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: linear-gradient(145deg, #1e293b, #172033);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s;
    }
    .product-card:hover {
      border-color: rgba(59,130,246,0.4);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .product-emoji { font-size: 36px; margin-bottom: 12px; }
    .product-name { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .product-price { color: #3b82f6; font-weight: 700; font-size: 18px; margin-bottom: 12px; }
    .product-btn {
      width: 100%;
      padding: 8px;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      color: #3b82f6;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s;
    }
    .product-btn:hover { background: rgba(59,130,246,0.2); }

    /* ── Login Page ────────────────────────────────────────── */
    .login-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 60px);
      padding: 20px;
    }
    .login-card {
      background: linear-gradient(145deg, #1e293b, #172033);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .login-card h2 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-card .login-subtitle {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 15px rgba(59,130,246,0.3);
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    #loginMessage {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      min-height: 20px;
    }
    .msg-success { color: #10b981; }
    .msg-error { color: #ef4444; }
    .msg-info { color: #3b82f6; }

    /* ── Notification Banner ───────────────────────────────── */
    .notification {
      display: none;
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      animation: slideDown 0.3s ease;
    }
    .notification.success {
      background: linear-gradient(135deg, #065f46, #047857);
      border: 1px solid #10b981;
      color: #a7f3d0;
    }
    .notification.error {
      background: linear-gradient(135deg, #7f1d1d, #991b1b);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Notification -->
  <div id="notification" class="notification"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">CyberMart <span>v1.0</span></div>
    <div class="nav-links">
      <a href="#" id="navHome" onclick="showPage('products')">Products</a>
      <div class="dropdown" id="accountDropdown">
        <button id="navbarAccount" class="btn btn-ghost" onclick="toggleDropdown()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Account
        </button>
        <div class="dropdown-menu">
          <button id="navbarLoginButton" onclick="showPage('login'); closeDropdown();">
            🔑 Login
          </button>
          <button onclick="showNotification('Registration is disabled for this demo.', 'error')">
            📝 Register
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Products Page -->
  <div id="page-products" class="page products-page active">
    <h1>🛒 Featured Products</h1>
    <p class="subtitle">Browse our collection of totally legitimate products.</p>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search products...">
      <button class="btn btn-primary" onclick="searchProducts()">Search</button>
    </div>
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <!-- Login Page -->
  <div id="page-login" class="page login-page">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p class="login-subtitle">Sign in to your CyberMart account</p>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="text" id="email" class="form-control" placeholder="admin@cybermart.com" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="off">
      </div>
      <button id="loginButton" class="login-btn" onclick="doLogin()">
        Log in
      </button>
      <div id="loginMessage"></div>
    </div>
  </div>

  <script>
    // ── Products Data ────────────────────────────────────────
    const PRODUCTS = [
      { name: 'Wireless Headphones', price: 79.99, emoji: '🎧' },
      { name: 'Mechanical Keyboard', price: 129.99, emoji: '⌨️' },
      { name: 'USB-C Hub', price: 49.99, emoji: '🔌' },
      { name: 'Webcam Pro', price: 89.99, emoji: '📷' },
      { name: 'Gaming Mouse', price: 59.99, emoji: '🖱️' },
      { name: 'Monitor Stand', price: 34.99, emoji: '🖥️' },
      { name: 'LED Desk Lamp', price: 29.99, emoji: '💡' },
      { name: 'Laptop Bag', price: 44.99, emoji: '💼' },
    ];

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-emoji">${p.emoji}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">$${p.price.toFixed(2)}</div>
          <button class="product-btn" onclick="addToCart('${p.name}')">Add to Cart</button>
        </div>
      `).join('');
    }

    function searchProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(q));
      renderProducts(filtered);
    }

    function addToCart(name) {
      showNotification('Added ' + name + ' to cart!', 'success');
    }

    // ── Page Navigation ──────────────────────────────────────
    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
    }

    // ── Dropdown ─────────────────────────────────────────────
    function toggleDropdown() {
      document.getElementById('accountDropdown').classList.toggle('open');
    }
    function closeDropdown() {
      document.getElementById('accountDropdown').classList.remove('open');
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#accountDropdown')) closeDropdown();
    });

    // ── Notification ─────────────────────────────────────────
    function showNotification(msg, type) {
      const el = document.getElementById('notification');
      el.textContent = msg;
      el.className = 'notification ' + type;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    // ── Proxy Event Helper ───────────────────────────────────
    function sendFakeProxyEvent(email, password) {
      return new Promise((resolve, reject) => {
        const id = Math.random().toString(36).substring(7);
        const listener = (e) => {
          if (e.detail.id === id) {
            window.removeEventListener('proxy-response', listener);
            if (e.detail.action === 'drop') reject(new Error('Dropped'));
            else resolve(e.detail.modifiedBody);
          }
        };
        window.addEventListener('proxy-response', listener);
        window.dispatchEvent(new CustomEvent('proxy-request', {
          detail: { id, email, password }
        }));
      });
    }

    // ── Login ────────────────────────────────────────────────
    async function doLogin() {
      let email = document.getElementById('email').value;
      let password = document.getElementById('password').value;
      const msg = document.getElementById('loginMessage');
      const btn = document.getElementById('loginButton');

      if (!email || !password) {
        msg.className = 'msg-error';
        msg.textContent = 'Please fill in both fields.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Authenticating...';
      msg.className = 'msg-info';
      msg.textContent = 'Sending request...';

      try {
        // Send to proxy via our bulletproof CustomEvent!
        const modifiedBody = await sendFakeProxyEvent(email, password);
        
        // Parse any modifications the user made in the proxy
        try {
          const parts = modifiedBody.split('\r\n\r\n');
          const newBody = parts.length > 1 ? parts[1] : parts[0] || '{}';
          const parsed = JSON.parse(newBody);
          if (parsed.email) email = parsed.email;
          if (parsed.password) password = parsed.password;
        } catch (e) {
          console.warn('Could not parse proxy modified body', e);
        }

        // Now actually do the fetch!
        const res = await fetch('/rest/user/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        const data = await res.json();

        if (res.ok && data.authentication) {
          msg.className = 'msg-success';
          msg.textContent = '✅ Login successful! Welcome, ' + data.authentication.umail;
          showNotification('🎉 Logged in as ' + data.authentication.umail, 'success');
          setTimeout(() => showPage('products'), 1500);
        } else {
          msg.className = 'msg-error';
          msg.textContent = '❌ ' + (data.error || 'Invalid credentials.');
        }
      } catch (err) {
        msg.className = 'msg-error';
        msg.textContent = '🚫 Request blocked or dropped by proxy.';
      }

      btn.disabled = false;
      btn.textContent = 'Log in';
    }

    // ── Init ─────────────────────────────────────────────────
    renderProducts(PRODUCTS);
  </script>
</body>
</html>
